name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish a short build log to the build-log branch
        if: always()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Execution failed|Could not|Unresolved|BUILD " build.log | head -150 > errors.txt || true
          tail -n 120 build.log > tail.txt || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf -q --cached .
          git add -f errors.txt tail.txt
          git commit -qm "Build log for ${GITHUB_SHA}"
          git push -f origin build-log
      - uses: actions/upload-artifact@v4
        with:
          name: Notify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
