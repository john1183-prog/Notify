name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish build log to the build-log branch
        if: always()
        run: |
          mkdir /tmp/bl && cd /tmp/bl && git init -q -b build-log
          grep -nE "^e: |error:|FAILED|What went wrong|Execution failed|Could not|BUILD " "$GITHUB_WORKSPACE/build.log" | head -200 > errors.txt || true
          tail -n 300 "$GITHUB_WORKSPACE/build.log" > tail.txt
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
      - uses: actions/upload-artifact@v4
        with:
          name: Notify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
